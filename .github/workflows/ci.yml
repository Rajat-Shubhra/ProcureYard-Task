name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Unit and contract tests
        run: pytest --cov=app --cov-report=term-missing

      - name: Alembic migration and model parity
        env:
          DATABASE_URL: sqlite+pysqlite:///migration-check.db
          APP_ENV: test
          LLM_PROVIDER: fake
        run: alembic upgrade head && alembic check && alembic heads

      - name: Prepare Compose environment
        run: cp .env.example .env && sed -i 's/^LLM_PROVIDER=.*/LLM_PROVIDER=fake/' .env

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build and start stack
        run: docker compose up --build --detach

      - name: Wait for ready health
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Black-box duplicate-delivery smoke eval
        run: python evals/run.py http://localhost:8000 --case 4 --poll-seconds 15

      - name: Stop stack
        if: always()
        run: docker compose down --volumes

