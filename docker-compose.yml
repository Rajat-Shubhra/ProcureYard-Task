# Starter file. Add your own services (your app, Postgres) next to payswift. Leave payswift as it is.

# Shared by the application containers. `.env` is optional (git-ignored): a bare
# `docker compose up` on a clean clone runs with the deterministic fake LLM provider; copy
# `.env.example` to `.env` and set LLM_PROVIDER=groq plus GROQ_API_KEY for the real model.
x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    LLM_PROVIDER: ${LLM_PROVIDER:-fake}
    DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://quickdrop:quickdrop_dev@postgres:5432/quickdrop}
    PAYSWIFT_BASE_URL: ${PAYSWIFT_BASE_URL:-http://payswift:8081}
    DATA_DIR: ${DATA_DIR:-/app/data}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quickdrop}
      POSTGRES_USER: ${POSTGRES_USER:-quickdrop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quickdrop_dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  ingest:
    <<: *app
    command: ["python", "-m", "app.ingestion.cli"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    <<: *app
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      ingest:
        condition: service_completed_successfully
      payswift:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  worker:
    <<: *app
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    depends_on:
      ingest:
        condition: service_completed_successfully

  payswift:
    build: ./payswift
    ports:
      - "8081:8081"

volumes:
  postgres_data:
