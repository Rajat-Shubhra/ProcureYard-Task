[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quickdrop-dispute-desk"
version = "0.1.0"
description = "QuickDrop rider payout dispute desk"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<1.15",
  "fastapi>=0.115,<0.116",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "jsonschema>=4.23,<5",
  "psycopg[binary]>=3.2,<3.3",
  "pydantic-settings>=2.6,<2.8",
  "sqlalchemy>=2.0.36,<2.1",
  "uvicorn[standard]>=0.32,<0.35",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

